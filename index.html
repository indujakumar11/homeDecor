<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Hero image preload, Home only. This page serves every route (HashRouter),
         so a static <link rel="preload"> also fetched the hero on pages that never
         show it ("preloaded using link preload but not used"). The relative URL
         resolves exactly like the Hero <img src>, under any base path. -->
    <script>
      (function () {
        var path = location.hash.replace(/^#/, '').split(/[?#]/)[0];
        if (path !== '' && path !== '/') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/webp';
        link.href = 'assets/hero/hero-bg.webp';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />

    <!-- Primary Meta Tags -->
    <!-- Home title; other routes set their own document.title (see App.jsx). -->
    <title>Black Shades Home Decors | Premium Interior & Architectural Décor in Chennai</title>
    <meta name="description" content="Black Shades Home Decors creates premium interiors, custom murals, sculptures, architectural décor, signage and turnkey solutions across Chennai and surrounding areas." />
    <meta name="keywords" content="Black Shades Home Decors, luxury interior design Chennai, custom relief murals, FRP fiberglass sculptures, marble stone powder statues, 3D parametric walls, turnkey interior execution, architectural decor Chennai" />
    <meta name="author" content="Black Shades Home Decors" />

    <!-- Open Graph / Facebook -->
    <!-- og:url and the og:image / twitter:image URLs need the confirmed public
         domain (absolute URLs for social previews); not changed until it's
         confirmed. Vite prefixes the image paths with the build base. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Black Shades Home Decors" />
    <meta property="og:url" content="https://blackshadeshomedecors.com/" />
    <meta property="og:title" content="Black Shades Home Decors | Spaces That Inspire" />
    <meta property="og:description" content="We design, sculpt and create distinctive spaces through premium décor, custom craftsmanship and complete interior solutions." />
    <meta property="og:image" content="/assets/hero/hero-bg.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Dark luxury living room with a backlit geometric relief feature wall, a bronze sculpture and floor-to-ceiling windows" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Black Shades Home Decors | Spaces That Inspire" />
    <meta name="twitter:description" content="We design, sculpt and create distinctive spaces through premium décor, custom craftsmanship and complete interior solutions." />
    <meta name="twitter:image" content="/assets/hero/hero-bg.webp" />
    <meta name="twitter:image:alt" content="Dark luxury living room with a backlit geometric relief feature wall, a bronze sculpture and floor-to-ceiling windows" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
