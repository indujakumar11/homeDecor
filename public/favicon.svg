<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d98c" />
      <stop offset="30%" stop-color="#d4af63" />
      <stop offset="70%" stop-color="#b58a3c" />
      <stop offset="100%" stop-color="#7c5c20" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7329" />
      <stop offset="50%" stop-color="#eac875" />
      <stop offset="100%" stop-color="#b58a3c" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b58a3c" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Dark Rounded Hexagon / Box -->
  <rect width="120" height="120" rx="20" fill="#0c0c0c"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Geometric Interlocking BS Monogram -->
  <g filter="url(#goldGlow)" transform="translate(18, 15)">
    <!-- B Column & Upper Loop -->
    <path d="M12 8 L32 8 L44 20 L44 38 L34 46 L44 54 L44 74 L32 82 L12 82 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="square"/>
    <path d="M12 46 L34 46" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="square"/>
    
    <!-- S Geometric Fold Overlay -->
    <path d="M50 18 L68 8 L74 16 L58 28 L74 44 L74 72 L56 82 L38 82" fill="none" stroke="url(#goldLight)" stroke-width="5" stroke-linejoin="miter" stroke-linecap="square"/>
    
    <!-- Central Facet Accent -->
    <polygon points="28,24 36,24 32,34 24,34" fill="url(#goldGrad)" opacity="0.9"/>
    <polygon points="28,58 36,58 32,68 24,68" fill="url(#goldGrad)" opacity="0.9"/>
  </g>
</svg>